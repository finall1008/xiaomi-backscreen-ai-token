<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;background:#000;overflow:hidden}
.device{position:relative;width:100%;height:65.350877vw;border-radius:8.4% / 12.9%;overflow:hidden}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.lens{position:absolute;left:3.29%;width:26.32%;aspect-ratio:1/1;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 38% 35%,#3a3f4a 0%,#14161c 55%,#05060a 78%,#2a2f3a 100%);box-shadow:inset 0 0 0 6px #000,0 0 0 3px rgba(255,255,255,.06)}
.lens::after{content:"";position:absolute;left:36%;top:32%;width:16%;height:16%;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(140,180,255,.5),rgba(20,30,60,.08) 70%)}
.top{top:5.03%}.bottom{top:54.87%}
</style>
</head>
<body>
<div class="device">
<canvas id="rear" width="912" height="596"></canvas>
<div class="lens top"></div><div class="lens bottom"></div>
</div>
<script src="preview.js"></script>
<script src="renderer.js"></script>
</body>
</html>
