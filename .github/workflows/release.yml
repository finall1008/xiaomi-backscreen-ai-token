name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (set +o pipefail; yes | "$SDKMANAGER" --licenses > /dev/null)
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore release signing key
        env:
          RELEASE_JKS_BASE64: ${{ secrets.RELEASE_JKS_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${RELEASE_JKS_BASE64:?missing secret RELEASE_JKS_BASE64}"
          : "${RELEASE_STORE_PASSWORD:?missing secret RELEASE_STORE_PASSWORD}"
          : "${RELEASE_KEY_ALIAS:?missing secret RELEASE_KEY_ALIAS}"
          : "${RELEASE_KEY_PASSWORD:?missing secret RELEASE_KEY_PASSWORD}"
          mkdir -p signing
          printf '%s' "$RELEASE_JKS_BASE64" | base64 -d > signing/finall.jks
          chmod 600 signing/finall.jks

      - name: Test card interactions
        run: node scripts/test-card-pointer.cjs

      - name: Test and build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Verify owner signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          CERTS=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK")
          printf '%s\n' "$CERTS"
          EXPECTED=33f92075e81fc19c93bb58f83c0db334888e635926ef400849569b91f86102f5
          printf '%s\n' "$CERTS" | grep -Fqx "Signer #1 certificate SHA-256 digest: $EXPECTED"

      - name: Stage release artifact
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ai-usage-${TAG}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: ai-usage-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ai-usage-${{ github.ref_name }}.apk
          generate_release_notes: true

      - name: Remove temporary signing material
        if: always()
        run: |
          TARGET="$GITHUB_WORKSPACE/signing/finall.jks"
          test "$(realpath -m "$TARGET")" = "$GITHUB_WORKSPACE/signing/finall.jks"
          rm -f -- "$TARGET"
