name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test module and card interactions
        run: npm test

      - name: Build module ZIP
        run: npm run build

      - name: Verify committed repository import files are up to date
        run: git diff --exit-code -- card webroot background

      - name: Verify release tag matches module version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e 'const m=require("./module.json");if(process.env.GITHUB_REF_NAME!==`v${m.version}`)throw Error("Tag must match module.json version")'

      - name: Upload module artifact
        uses: actions/upload-artifact@v5
        with:
          name: ai-usage-module
          path: dist/ai-usage-*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ai-usage-*.zip
          body: |
            AI 用量背屏模块（rear-card-bridge API v2），支持 Codex、Kimi Code、DeepSeek、小米 MiMo 与 Cursor。

            - 保留 2×2 总览和来源详情，新增暗色柔光玻璃与最左侧简洁页。
            - 卡片外观支持多选 JPEG / PNG / WebP 壁纸、删除与恢复默认；多张按加入顺序在运行环境恢复时轮换。
            - 壁纸与页码同步保存在常显快照中；首帧直接使用已缓存的 Data URL，不等待异步存储或图片 onload。
            - 翻页与下拉改为按时间驱动的缓动，保留当前页；总览和详情顶部对齐，简洁页同宽等分排列。
            - 可从仓库 main 导入：https://github.com/finall1008/xiaomi-backscreen-ai-token，也可下载本 Release ZIP 安装。
            - 请搭配卡片桥 v1.3.1 或更新版本，以使用原生图片多选；图库没有固定张数限制，完整常显快照须在宿主 800K 上限内。
          generate_release_notes: true

      - name: Check module shop credentials
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MODULE_STORE_TOKEN: ${{ secrets.MODULE_STORE_TOKEN }}
        run: |
          test -n "$MODULE_STORE_TOKEN" || { echo "::error::Set MODULE_STORE_TOKEN with Contents read/write access to finall1008/rear-card-modules"; exit 1; }

      - name: Checkout module shop publisher
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v5
        with:
          repository: finall1008/rear-card-modules
          ref: main
          path: _module-store
          token: ${{ secrets.MODULE_STORE_TOKEN }}
          persist-credentials: false

      - name: Update module shop
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MODULE_STORE_TOKEN: ${{ secrets.MODULE_STORE_TOKEN }}
        run: |
          python3 _module-store/scripts/publish-module.py \
            "dist/ai-usage-${GITHUB_REF_NAME#v}.zip" \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
